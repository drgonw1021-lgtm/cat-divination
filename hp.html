<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你是霍格沃茨的谁 · 魔法测格</title>
<style>
:root{
  --night:#141024;
  --night2:#1e1833;
  --gold:#d4af37;
  --gold-soft:#e8c96a;
  --parch:#f3e9d2;
  --parch2:#e5d5b0;
  --ink:#3a2f1f;
  --ink-soft:#6b5d45;
  --rose:#e8a5b5;
  --shadow:rgba(0,0,0,.5);
  --gry:#ae0001; --sly:#2d4c3a; --rav:#222f50; --huf:#ecb939;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;
  background:radial-gradient(ellipse at 50% -20%,#2a2145 0%,var(--night) 55%,#0b0817 100%);
  color:var(--parch);
  line-height:1.8;
  min-height:100vh;
  overflow-x:hidden;
}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;opacity:.5;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.9}}
#app{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:22px 20px 44px}
.screen{display:none;animation:fadeUp .5s ease both}
.screen.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* header */
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
.brand img{width:44px;height:44px;object-fit:contain;border-radius:50%}
.brand .bt{font-size:14px;letter-spacing:4px;color:var(--gold)}
h1{font-size:24px;text-align:center;letter-spacing:6px;color:var(--gold-soft);font-weight:600;margin:8px 0}
.sub{text-align:center;font-size:12px;letter-spacing:4px;color:#8a7fb0;margin-bottom:22px}
.hr{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.4;margin:22px 0}

/* cards */
.card-magic{background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.25);border-radius:14px;padding:20px;margin-bottom:14px;backdrop-filter:blur(4px)}
.lede{font-size:14.5px;color:#cfc4e8;text-align:center;line-height:2}
.lede b{color:var(--gold-soft)}
.steps{list-style:none;margin-top:14px}
.steps li{position:relative;padding:10px 14px 10px 42px;margin-bottom:8px;background:rgba(212,175,55,.06);border-radius:10px;font-size:13.5px;color:#c9bede;line-height:1.7}
.steps li::before{content:"✦";position:absolute;left:16px;top:9px;color:var(--gold);font-size:14px}
.steps li b{color:var(--gold-soft)}
.btn{display:block;width:100%;margin-top:16px;padding:15px;background:linear-gradient(135deg,var(--gold),#a8842a);color:#1a1305;border:none;border-radius:30px;font-family:inherit;font-size:16px;font-weight:600;letter-spacing:6px;cursor:pointer;box-shadow:0 6px 24px rgba(212,175,55,.3);transition:all .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(212,175,55,.4)}
.btn.ghost{background:transparent;border:1px solid rgba(212,175,55,.4);color:var(--gold-soft);letter-spacing:3px;font-size:14px;padding:12px;box-shadow:none}
.btn.ghost:hover{background:rgba(212,175,55,.08)}
.disc{margin-top:16px;font-size:11px;color:#6a5f8a;text-align:center;line-height:1.7}

/* quiz */
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:11px 15px;background:rgba(255,255,255,.05);border:1px solid rgba(212,175,55,.18);border-radius:10px}
.qnum{font-size:12px;color:#a99cc9;letter-spacing:1px}
.pips{display:flex;gap:4px}
.pip{width:22px;height:3px;background:rgba(255,255,255,.15);border-radius:2px}
.pip.done{background:var(--gold)}
.pip.cur{background:var(--rose);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.runebar{display:flex;justify-content:center;gap:16px;padding:14px 0;font-size:13px;color:#7f74a6}
.rune{display:flex;flex-direction:column;align-items:center;gap:4px;transition:.4s}
.rune .sym{font-size:22px;color:#4d4470;transition:.4s}
.rune.lit .sym{color:var(--gold);text-shadow:0 0 14px rgba(212,175,55,.7)}
.rune .lab{font-size:10px;letter-spacing:1px}
.qtext{font-size:17px;line-height:1.8;margin:16px 0;color:var(--parch);min-height:60px}
.opt{display:block;width:100%;text-align:left;margin-bottom:11px;padding:14px 15px;background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.2);color:var(--parch);font-family:inherit;font-size:14.5px;line-height:1.65;border-radius:10px;cursor:pointer;transition:all .18s}
.opt:hover{background:rgba(212,175,55,.1);border-color:var(--gold);transform:translateX(3px)}
.opt.sel{background:rgba(212,175,55,.22);border-color:var(--gold);color:#fff}
.qhint{font-size:11px;color:#6a5f8a;text-align:center;letter-spacing:2px;margin-top:6px}

/* spell overlay */
.spell-overlay{position:fixed;inset:0;background:rgba(20,16,36,.88);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.spell-inner{text-align:center}
.spell-cat{font-size:90px;display:inline-block;animation:spellShake .9s cubic-bezier(.3,1.4,.5,1)}
@keyframes spellShake{0%{transform:translateY(-60px) rotate(-30deg);opacity:0}45%{transform:translateY(10px) rotate(15deg);opacity:1}70%{transform:translateY(-8px) rotate(-8deg)}100%{transform:translateY(0) rotate(0);opacity:1}}
.spell-word{margin-top:14px;font-size:20px;letter-spacing:6px;color:var(--gold-soft);animation:wordGlow 1.1s ease;font-style:italic}
@keyframes wordGlow{0%{opacity:0;letter-spacing:14px}60%{opacity:1}100%{opacity:1;letter-spacing:6px}}
.spell-spark{position:absolute;font-size:22px;animation:sparkFly 1s ease-out forwards}
@keyframes sparkFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}

/* selecting */
#select{text-align:center;padding-top:70px}
.hat{font-size:110px;display:inline-block;animation:hatSpin 1.8s ease-in-out}
@keyframes hatSpin{0%{transform:rotate(0) scale(.5);opacity:0}30%{opacity:1}100%{transform:rotate(720deg) scale(1);opacity:1}}
#select p{margin-top:22px;letter-spacing:6px;color:#a99cc9;font-size:14px}

/* result parchment */
.parch-card{background:linear-gradient(160deg,var(--parch) 0%,var(--parch2) 100%);color:var(--ink);border-radius:6px;padding:26px 22px;position:relative;box-shadow:0 20px 60px -18px rgba(0,0,0,.85)}
.parch-card::before{content:"";position:absolute;inset:8px;border:1px solid rgba(58,47,31,.2);border-radius:3px;pointer-events:none}
.parch-card .seal{position:absolute;right:16px;top:16px;width:46px;height:46px;border:2px solid var(--gry);color:var(--gry);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1.1;text-align:center;transform:rotate(8deg);opacity:.85;padding:2px}
.char-face{font-size:64px;text-align:center;margin:6px 0}
.char-name{font-size:30px;text-align:center;font-weight:700;letter-spacing:3px;color:var(--ink)}
.char-en{text-align:center;font-size:12px;letter-spacing:3px;color:var(--ink-soft);text-transform:uppercase;margin-top:2px}
.char-tag{text-align:center;font-size:14px;color:#4a3d28;margin-top:12px;font-weight:600}
.char-verdict{margin-top:14px;padding:14px;background:rgba(58,47,31,.06);border-radius:8px;font-size:14px;line-height:1.9;color:#3a2f1f}
.house-row{display:flex;align-items:center;gap:10px;margin-top:14px;padding:11px 13px;background:rgba(58,47,31,.05);border-radius:8px}
.house-dot{width:16px;height:16px;border-radius:50%;flex:none}
.house-row .ht{font-size:13px;color:#3a2f1f}
.house-row .hs{font-size:11px;color:var(--ink-soft);margin-left:auto}
.kv{margin-top:18px}
.kv .row{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed rgba(58,47,31,.15);font-size:13.5px}
.kv .k{color:var(--ink-soft);flex:none;width:70px;letter-spacing:1px}
.kv .v{color:#3a2f1f}
.block{margin-top:24px}
.bt-h{font-size:13px;letter-spacing:5px;color:var(--gold);margin-bottom:11px;display:flex;align-items:center;gap:10px}
.bt-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(212,175,55,.4),transparent)}
.panel{background:rgba(255,255,255,.05);border:1px solid rgba(212,175,55,.18);border-radius:12px;padding:15px 16px;font-size:13.5px;color:#cfc4e8;line-height:1.85}
.panel b{color:var(--gold-soft)}
.badge{display:inline-block;font-size:11px;letter-spacing:1px;padding:3px 9px;border-radius:12px;margin-right:6px;font-weight:600}
.badge.gold{background:var(--gold);color:#1a1305}
.badge.rose{background:var(--rose);color:#3a1c24}
.badge.dim{background:rgba(255,255,255,.12);color:#cfc4e8}
.small{font-size:11.5px;color:#8a7fb0;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{padding:7px 11px;border:1px solid rgba(212,175,55,.25);border-radius:18px;font-size:12px;color:#cfc4e8;cursor:pointer;background:transparent;font-family:inherit;transition:all .18s}
.chip:hover,.chip.on{border-color:var(--gold);color:#fff;background:rgba(212,175,55,.15)}
.meter{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--rose));width:0;transition:width 1s ease}
.grid16{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
.gcell{border:1px solid rgba(212,175,55,.2);border-radius:9px;padding:9px 3px;text-align:center;cursor:pointer;transition:.18s;background:rgba(255,255,255,.03)}
.gcell:hover{border-color:var(--gold);transform:translateY(-2px)}
.gcell .s{font-size:20px;line-height:1.2}
.gcell .n{font-size:10.5px;color:#a99cc9;margin-top:2px}
.gcell.me{border-color:var(--rose);background:rgba(232,165,181,.15)}
.house-bars{margin-top:8px}
.hbar{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:12px;color:#cfc4e8}
.hbar .nm{width:56px;flex:none}
.hbar .tr{flex:1;height:7px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:100%;width:0;border-radius:4px;transition:width 1s ease}
.hbar .pc{width:34px;text-align:right;font-size:11px;color:#8a7fb0}
</style>
</head>
<body>
<div id="stars"></div>
<div id="app">

<!-- INTRO -->
<section class="screen on" id="s-intro">
  <div class="brand"><img src="images/logo.jpg" alt=""><span class="bt">小猫起卦 · 新篇</span></div>
  <h1>你是霍格沃茨的谁</h1>
  <div class="sub">四 维 魔 法 测 格 · 16 人 物</div>
  <div class="hr"></div>
  <div class="card-magic">
    <p class="lede">分院帽只看学院。<br>这个测试看<b>你是故事里的谁</b>。</p>
    <ul class="steps">
      <li>四条魔法轴：<b>面对世界</b>、<b>做决定</b>、<b>人群里</b>、<b>表达</b>。</li>
      <li>每条轴 4 道题，组合起来正好 <b>16 个角色</b> —— 从哈利到多比都有。</li>
      <li>每题选项还带着<b>学院倾向</b>，最后算出你的分院结果。</li>
      <li>某条轴 4 题全选同一边 → <b>纯度拉满</b>，约十六分之一的人会遇到。</li>
    </ul>
    <button class="btn" onclick="startQuiz()">进入 大厅</button>
    <button class="btn ghost" onclick="openRoster()">先看 16 人名单</button>
    <button class="btn ghost" onclick="location.href='index.html'">← 小猫起卦</button>
    <p class="disc">娱乐向测试 · 与原著设定不完全一致 · 角色匹配基于性格轴</p>
  </div>
</section>

<!-- QUIZ -->
<section class="screen" id="s-quiz">
  <div class="qhead">
    <div class="qnum" id="qProg"></div>
    <div class="pips" id="qPips"></div>
  </div>
  <div class="runebar" id="runebar"></div>
  <div class="qtext" id="qText"></div>
  <div id="qOpts"></div>
  <div class="qhint" id="qHint"></div>
</section>

<!-- SELECTING -->
<section class="screen" id="select">
  <div class="hat">🎩</div>
  <p>分院帽正在思考...</p>
</section>

<!-- RESULT -->
<section class="screen" id="s-res"></section>

<!-- ROSTER -->
<section class="screen" id="s-roster"></section>

</div>

<script>

const AXES = [

  { s:'拿到了活点地图', o:[

  { s:'韦斯莱双子的笑话店', o:[

    {t:'我是他们的投资人', v:'稳', h:'sly'} ]}

/* ============ 学院 ============ */
const HOUSES = {
  gry:{name:'格兰芬多', color:'#ae0001', emoji:'🦁', line:'勇气与莽撞只隔一步，你选的那一步通常很快。'},

const CHARS = {

  '1100':{ n:'纳威·隆巴顿', en:'Neville Longbottom', face:'🌱', tag:'最胆小的人，最后拔剑',
    verdict:'敢冲、凭真心、独处、稳。你不是天生勇敢，你是慢慢长出来的 —— 这种勇气更贵。',

/* 角色在原著里的学院（用于对比分院结果）*/
const CANON_HOUSE = {
  '1111':'gry','1110':'gry','1101':'rav','1100':'gry',
  '1011':'gry','1010':'gry','1001':'rav','1000':'gry',
  '0111':'gry','0110':'huf','0101':'gry','0100':'',
  '0011':'sly','0010':'gry','0001':'huf','0000':'sly'
};

/* 咒语池 */
const SPELLS = ['除你武器','荧光闪烁','呼神护卫','恢复如初','咧嘴呼啦啦','阿拉霍洞开','速速前来','皮皮鬼走开'];

/* ============ 引擎 ============ */
let qi=0, votes=[0,0,0,0], lines=[null,null,null,null], houseTally={gry:0,sly:0,rav:0,huf:0};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');window.scrollTo(0,0)}

function startQuiz(){
  qi=0;votes=[0,0,0,0];lines=[null,null,null,null];houseTally={gry:0,sly:0,rav:0,huf:0};
  show('s-quiz');renderRunes();renderQ();
}
function renderRunes(){
  document.getElementById('runebar').innerHTML = AXES.map((a,i)=>
    `<div class="rune ${lines[i]!==null?'lit':''}"><span class="sym">${a.sym}</span><span class="lab">${a.name}</span></div>`
  ).join('');
}
function renderPips(){
  const ax=Math.floor(qi/4);
  document.getElementById('qPips').innerHTML = AXES.map((a,i)=>
    `<div class="pip ${i<ax?'done':(i===ax?'cur':'')}"></div>`).join('');
}
function renderQ(){
  if(qi>=16){ doSelecting(); return; }
  const q=BANK[qi], ax=AXES[Math.floor(qi/4)];
  document.getElementById('qProg').textContent=`第 ${qi+1} / 16 题 · ${ax.name}`;
  document.getElementById('qText').textContent=q.s;
  const pair=shuffle([...q.o]);
  document.getElementById('qOpts').innerHTML=pair.map((o,i)=>
    `<button class="opt" onclick="pick(${i},'${o.v}','${o.h}')">${o.t}</button>`).join('');
  document.getElementById('qHint').textContent=ax.desc;
  renderPips();renderRunes();
}
function pick(i,v,h){
  document.querySelectorAll('.opt').forEach((b,bi)=>b.classList.toggle('sel',bi===i));
  const ax=Math.floor(qi/4);
  if(v===AXES[ax].a) votes[ax]++;
  houseTally[h]++;
  castSpell();
  setTimeout(()=>{
    qi++;
    if(qi%4===0){
      const cnt=votes[ax];
      lines[ax]={ a:cnt>=3, pure:(cnt===4||cnt===0) };
      renderRunes();
    }
    renderQ();
  },1150);
}
function castSpell(){
  const ov=document.createElement('div');
  ov.className='spell-overlay';
  const word=SPELLS[Math.floor(Math.random()*SPELLS.length)];
  let sparks='';
  for(let i=0;i<6;i++){
    const dx=(Math.random()*160-80).toFixed(0), dy=(Math.random()*-120-20).toFixed(0);
    sparks+=`<span class="spell-spark" style="--dx:${dx}px;--dy:${dy}px;left:${45+Math.random()*10}%;top:${40+Math.random()*10}%">✨</span>`;
  }
  ov.innerHTML=`<div class="spell-inner">${sparks}<div class="spell-cat"><img src="images/logo.jpg" style="width:120px;height:120px;object-fit:contain"></div><div class="spell-word">${word}!</div></div>`;
  document.body.appendChild(ov);
  setTimeout(()=>ov.remove(),1050);
}
function doSelecting(){ show('select'); setTimeout(()=>{renderResult();show('s-res')},2000); }

function compute(){
  const code=lines.map(l=>l.a?'1':'0').join('');
  const ch=CHARS[code];
  const total=Object.values(houseTally).reduce((a,b)=>a+b,0);
  let best=HOUSE_ORDER[0];
  HOUSE_ORDER.forEach(h=>{ if(houseTally[h]>houseTally[best]) best=h; });
  const pureCount=lines.filter(l=>l.pure).length;
  return {code,ch,house:best,total,pureCount};
}
function renderResult(){
  const r=compute(); const C=r.ch; const H=HOUSES[r.house];
  const canonHouse = CANON_HOUSE[r.code]||'';
  const matchHouse = canonHouse && canonHouse===r.house;
  const pureBadge = r.pureCount>=2 ? `<span class="badge gold">纯度 ${r.pureCount}/4</span>约十六分之一`
    : r.pureCount===1 ? `<span class="badge rose">单轴拉满</span>约 6.25%`
    : `<span class="badge dim">均衡型</span>`;

  document.getElementById('s-res').innerHTML=`
    <div class="parch-card">
      <div class="seal">${H.emoji}<br>分院</div>
      <div class="char-face">${C.face}</div>
      <div class="char-name">${C.n}</div>
      <div class="char-en">${C.en}</div>
      <div class="char-tag">「 ${C.tag} 」</div>
      <div class="char-verdict">${C.verdict}</div>
      <div class="house-row">
        <span class="house-dot" style="background:${H.color}"></span>
        <span class="ht"><b>${H.name}</b> ${H.emoji}</span>
        <span class="hs">${matchHouse?'和原著学院一致！':'你的选择比帽子更准'}</span>
      </div>
    </div>

    <div class="kv">
      <div class="row"><div class="k">分院词</div><div class="v">${H.line}</div></div>
      <div class="row"><div class="k">守护神</div><div class="v">${C.patronus}</div></div>
      <div class="row"><div class="k">魔杖</div><div class="v">${C.wand}</div></div>
      <div class="row"><div class="k">别人眼中</div><div class="v">${C.eyes}</div></div>
      <div class="row"><div class="k">阴影面</div><div class="v">${C.shade}</div></div>
      <div class="row"><div class="k">你的纯度</div><div class="v">${C.canon}</div></div>
    </div>

    <div class="block">
      <div class="bt-h">四 维 能 量</div>
      <div class="panel">
        ${AXES.map((a,i)=>{
          const cnt=votes[i]; const left=cnt; const right=4-cnt;
          return `<div class="hbar"><span class="nm">${a.sym} ${a.a}</span>
            <span class="tr"><i style="background:linear-gradient(90deg,var(--gold),var(--rose))" data-w="${left/4*100}"></i></span>
            <span class="pc">${left}:${right}</span>
            <span class="nm" style="width:auto;text-align:right">${a.b}</span></div>`
        }).join('')}
        <div style="margin-top:10px">${pureBadge}</div>
      </div>
    </div>

    <div class="block">
      <div class="bt-h">分 院 细 节</div>
      <div class="panel">
        <div class="house-bars">
        ${HOUSE_ORDER.map(h=>{const x=HOUSES[h];const p=Math.round(houseTally[h]/r.total*100);
          return `<div class="hbar"><span class="nm">${x.emoji} ${x.name.slice(0,3)}</span>
            <span class="tr"><i style="background:${x.color}" data-w="${p}"></i></span>
            <span class="pc">${p}%</span></div>`}).join('')}
        </div>
        <div class="small" style="margin-top:8px">分院帽按你 16 次选择的学院倾向加权。${matchHouse?'这次它猜对了你的原著学院。':'它把你分到了和原著不同的学院 —— 说明你现在的活法，和角色设定不太一样。'}</div>
      </div>
    </div>

    <div class="block">
      <div class="bt-h">和 谁 最 合 拍</div>
      <div class="panel" style="padding-bottom:12px">
        <div class="small">选一个好友的角色，看你们在故事里能不能活到最后一部。</div>
        <div class="chips" id="pairChips"></div>
        <div id="pairOut"></div>
      </div>
    </div>

    <div class="block">
      <div class="bt-h">16 人 名 单</div>
      <div class="grid16">${Object.entries(CHARS).map(([c,x])=>
        `<div class="gcell ${c===r.code?'me':''}" onclick="peek('${c}')"><div class="s">${x.face}</div><div class="n">${x.n.split('·')[0]}</div></div>`).join('')}</div>
      <div id="peekOut"></div>
    </div>

    <button class="btn" onclick="copyCard()">复制结果卡</button>
    <button class="btn ghost" onclick="show('s-intro')">再 测 一 次</button>
    <button class="btn ghost" onclick="location.href='index.html'">← 小猫起卦</button>
    <p class="disc">娱乐向测试。角色匹配基于四条性格轴的 16 种组合，与原著设定不完全一致。</p>
  `;
  requestAnimationFrame(()=>{document.querySelectorAll('#s-res .meter i,#s-res .hbar i').forEach(i=>{i.style.width=(i.dataset.w||0)+'%'});});
  buildPair(r);
}

/* 配对：按轴相似度 */
function pairText(myCode,otherCode){
  const A=CHARS[myCode],B=CHARS[otherCode];
  let same=0; for(let i=0;i<4;i++) if(myCode[i]===otherCode[i]) same++;
  const diff=4-same;
  if(same===4) return {t:'同一个人',s:95,d:'完全同轴。你们要么成为最好的搭档，要么成为最烦对方的镜子 —— 因为你们最看不惯对方的地方，自己身上也有。'};
  if(diff===1) return {t:'高契合',s:88,d:`只差一条轴。${A.n} 和 ${B.n} 在故事里通常是并肩出现的那种 —— 一个冲动的时候另一个刚好踩得住。`};
  if(diff===2) return {t:'互补型',s:74,d:`两条轴相反。你们的用法是"分工"：${A.tag} × ${B.tag}。硬要干同一件事就会吵架。`};
  if(diff===3) return {t:'需要翻译',s:55,d:'三条轴不同。你们做同一个决定的路径完全相反 —— 能玩到一起靠的不是相似，是好奇。'};
  return {t:'镜像对',s:42,d:'四条轴全反。你们几乎是同一个人的两个版本。故事里这种组合通常一个活到结尾，另一个死在第七部。'};
}
function buildPair(r){
  document.getElementById('pairChips').innerHTML=Object.entries(CHARS).map(([c,x])=>
    `<button class="chip" onclick="doPair('${c}','${r.code}',this)">${x.face} ${x.n.split('·')[0]}</button>`).join('');
}
function doPair(otherCode,myCode,btn){
  document.querySelectorAll('#pairChips .chip').forEach(c=>c.classList.remove('on'));
  btn.classList.add('on');
  const rel=pairText(myCode,otherCode);
  document.getElementById('pairOut').innerHTML=`
    <div style="margin-top:12px;padding-top:12px;border-top:1px dashed rgba(212,175,55,.25)">
      <div style="font-size:14.5px;color:var(--parch)">${CHARS[myCode].n} × ${CHARS[otherCode].n}
        <span class="badge gold" style="margin-left:6px">${rel.t}</span></div>
      <div class="meter"><i data-w="${rel.s}"></i></div>
      <div class="small" style="color:#cfc4e8;font-size:13px">${rel.d}</div>
    </div>`;
  requestAnimationFrame(()=>{const el=document.querySelector('#pairOut .meter i');if(el)el.style.width=rel.s+'%'});
}
function peek(c){
  const x=CHARS[c];
  document.getElementById('peekOut').innerHTML=`
    <div class="panel" style="margin-top:10px">
      <b>${x.n}</b> ${x.face} <span style="font-size:11px;color:#8a7fb0">${x.en}</span><br>
      「${x.tag}」<br><span class="small" style="color:#a99cc9">${x.verdict}</span>
    </div>`;
}
function copyCard(){
  const r=compute();const C=r.ch,H=HOUSES[r.house];
  const txt=[
    `【霍格沃茨测格】我是：${C.n} ${C.face}`,
    `「${C.tag}」`,
    C.verdict,
    `分院结果：${H.name} ${H.emoji}`,
    `守护神：${C.patronus}`,
    `魔杖：${C.wand}`,
    `—— 你也来测：${location.href}`
  ].join('\n');
  navigator.clipboard.writeText(txt).then(()=>alert('已复制，去朋友圈发吧。'))
   .catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('已复制。')});
}
function openRoster(){
  show('s-roster');
  document.getElementById('s-roster').innerHTML=`
    <div class="bt-h" style="font-size:16px;letter-spacing:6px">16 人 名 单</div>
    <div class="small" style="margin-bottom:14px">四条轴（闯/守 · 心/脑 · 群/单 · 闹/稳）各取一值，组合正好 16 个角色。</div>
    ${Object.entries(CHARS).map(([c,x])=>`
      <div class="panel" style="margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="font-size:28px">${x.face}</div>
          <div><b style="font-size:15px;color:var(--gold-soft)">${x.n}</b>
            <div class="small">${x.en} · ${c.split('').map((v,i)=>AXES[i][v==='1'?'a':'b']).join('/')}</div></div>
        </div>
        <div style="margin-top:8px;font-size:13.5px;color:var(--parch)">「${x.tag}」</div>
        <div class="small" style="margin-top:5px">${x.verdict}</div>
      </div>`).join('')}
    <button class="btn" onclick="startQuiz()">进入 大厅</button>
    <button class="btn ghost" onclick="show('s-intro')">返回</button>`;
}

/* 星空 */
(function makeStars(){
  const box=document.getElementById('stars');
  for(let i=0;i<40;i++){
    const s=document.createElement('div');
    s.className='star';
    const sz=(Math.random()*2+1).toFixed(1);
    s.style.width=sz+'px';s.style.height=sz+'px';
    s.style.left=(Math.random()*100)+'%';
    s.style.top=(Math.random()*100)+'%';
    s.style.animationDelay=(Math.random()*3)+'s';
    box.appendChild(s);
  }
})();
</script>
