<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>你是魔法学院的谁 · 魔法测格</title>
<style>
/* 小工具基线：Android 8.1 / Chrome 61。flex 间距一律用子项 margin，不用 gap。 */

:root{
  --night:#141024;
  --night2:#1e1833;
  --gold:#d4af37;
  --gold-soft:#e8c96a;
  --parch:#f3e9d2;
  --parch2:#e5d5b0;
  --ink:#3a2f1f;
  --ink-soft:#6b5d45;
  --rose:#e8a5b5;
  --violet:#8a7fb0;
  --violet-soft:#cfc4e8;
  --gry:#ae0001; --sly:#2d4c3a; --rav:#222f50; --huf:#ecb939;
  --safe-top:0px;
  --safe-bottom:0px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
html,body{height:100%}
body{
  font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;
  background:radial-gradient(ellipse at 50% -20%,#2a2145 0%,var(--night) 55%,#0b0817 100%);
  background-attachment:fixed;
  color:var(--parch);
  line-height:1.8;
  min-height:100vh;
  min-height:var(--app-height,100vh);
  overflow-x:hidden;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

#stars{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;opacity:.5;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.9}}

#app{
  position:relative;z-index:1;
  max-width:440px;width:100%;
  margin:0 auto;
  padding:22px 20px 44px;
  padding-top:calc(22px + var(--safe-top, env(safe-area-inset-top, 0px)));
  padding-bottom:calc(44px + var(--safe-bottom, env(safe-area-inset-bottom, 0px)));
}

.screen{display:none;animation:fadeUp .5s ease both}
.screen.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
.brand{display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.brand img{width:44px;height:44px;object-fit:cover;border-radius:50%;margin-right:10px;background:#241b3d}
.brand .bt{font-size:14px;letter-spacing:4px;color:var(--gold)}
h1{font-size:24px;text-align:center;letter-spacing:6px;color:var(--gold-soft);font-weight:600;margin:8px 0;line-height:1.5}
.sub{text-align:center;font-size:12px;letter-spacing:4px;color:var(--violet);margin-bottom:22px}
.hr{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.4;margin:22px 0}

/* ---------- cards ---------- */
.card-magic{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(212,175,55,.25);
  border-radius:14px;padding:20px;margin-bottom:14px;
}
@supports ((-webkit-backdrop-filter:blur(4px)) or (backdrop-filter:blur(4px))){
  .card-magic{background:rgba(255,255,255,.04);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
}
.lede{font-size:14.5px;color:var(--violet-soft);text-align:center;line-height:2}
.lede b{color:var(--gold-soft)}
.steps{list-style:none;margin-top:14px}
.steps li{position:relative;padding:10px 14px 10px 42px;margin-bottom:8px;background:rgba(212,175,55,.06);border-radius:10px;font-size:13.5px;color:#c9bede;line-height:1.7}
.steps li::before{content:"\2736";position:absolute;left:16px;top:9px;color:var(--gold);font-size:14px}
.steps li b{color:var(--gold-soft)}
.last-result{margin-top:14px;padding:12px 14px;border:1px dashed rgba(212,175,55,.35);border-radius:10px;font-size:13px;color:var(--violet-soft);line-height:1.7}
.last-result b{color:var(--gold-soft)}

.btn{display:block;width:100%;margin-top:16px;padding:15px;background:linear-gradient(135deg,var(--gold),#a8842a);color:#1a1305;border:none;border-radius:30px;font-family:inherit;font-size:16px;font-weight:600;letter-spacing:6px;cursor:pointer;box-shadow:0 6px 24px rgba(212,175,55,.3);transition:transform .2s,box-shadow .2s,opacity .2s}
.btn:active{transform:translateY(2px);opacity:.9}
.btn.ghost{background:transparent;border:1px solid rgba(212,175,55,.4);color:var(--gold-soft);letter-spacing:3px;font-size:14px;padding:12px;box-shadow:none}
.btn.ghost:active{background:rgba(212,175,55,.1)}
.btn:disabled{opacity:.45}
.btn.mini{font-size:13px;letter-spacing:2px;padding:11px;margin-top:10px}
.disc{margin-top:16px;font-size:11px;color:#6a5f8a;text-align:center;line-height:1.7}

/* ---------- quiz ---------- */
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:11px 15px;background:rgba(255,255,255,.05);border:1px solid rgba(212,175,55,.18);border-radius:10px}
.qnum{font-size:12px;color:#a99cc9;letter-spacing:1px;min-width:0;margin-right:10px}
.pips{display:flex;flex:none}
.pip{width:22px;height:3px;background:rgba(255,255,255,.15);border-radius:2px}
.pip + .pip{margin-left:4px}
.pip.done{background:var(--gold)}
.pip.cur{background:var(--rose);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.runebar{display:flex;justify-content:center;padding:14px 0;font-size:13px;color:#7f74a6}
.rune{display:flex;flex-direction:column;align-items:center;margin:0 8px;transition:.4s}
.rune .sym{font-size:22px;color:#4d4470;transition:.4s;line-height:1.3}
.rune.lit .sym{color:var(--gold);text-shadow:0 0 14px rgba(212,175,55,.7)}
.rune .lab{font-size:10px;letter-spacing:1px;margin-top:4px}
.qtext{font-size:17px;line-height:1.8;margin:16px 0;color:var(--parch);min-height:60px}
.opt{display:block;width:100%;text-align:left;margin-bottom:11px;padding:14px 15px;background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.2);color:var(--parch);font-family:inherit;font-size:14.5px;line-height:1.65;border-radius:10px;cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
.opt:active{background:rgba(212,175,55,.14);border-color:var(--gold)}
.opt.sel{background:rgba(212,175,55,.22);border-color:var(--gold);color:#fff}
.opt[disabled]{opacity:.6}
.qhint{font-size:11px;color:#6a5f8a;text-align:center;letter-spacing:2px;margin-top:6px}

/* ---------- spell overlay ---------- */
.spell-overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(20,16,36,.88);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .25s ease}
.spell-overlay[hidden]{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.spell-inner{position:relative;text-align:center}
.spell-cat{display:inline-block;animation:spellShake .9s cubic-bezier(.3,1.4,.5,1)}
.spell-cat img{width:120px;height:120px;object-fit:cover;border-radius:50%;display:block}
@keyframes spellShake{0%{transform:translateY(-60px) rotate(-30deg);opacity:0}45%{transform:translateY(10px) rotate(15deg);opacity:1}70%{transform:translateY(-8px) rotate(-8deg)}100%{transform:translateY(0) rotate(0);opacity:1}}
.spell-word{margin-top:14px;font-size:20px;letter-spacing:6px;color:var(--gold-soft);animation:wordGlow 1.1s ease;font-style:italic}
@keyframes wordGlow{0%{opacity:0;letter-spacing:14px}60%{opacity:1}100%{opacity:1;letter-spacing:6px}}
.spell-sparks{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none}
.spell-spark{position:absolute;font-size:22px;animation:sparkFly 1s ease-out forwards}
@keyframes sparkFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx,0),var(--dy,0)) scale(.3)}}

/* ---------- selecting ---------- */
#s-select{text-align:center;padding-top:70px}
.hat{font-size:110px;display:inline-block;line-height:1;animation:hatSpin 1.8s ease-in-out}
@keyframes hatSpin{0%{transform:rotate(0) scale(.5);opacity:0}30%{opacity:1}100%{transform:rotate(720deg) scale(1);opacity:1}}
#s-select p{margin-top:22px;letter-spacing:6px;color:#a99cc9;font-size:14px}

/* ---------- result parchment ---------- */
.parch-card{background:linear-gradient(160deg,var(--parch) 0%,var(--parch2) 100%);color:var(--ink);border-radius:6px;padding:26px 22px;position:relative;box-shadow:0 20px 60px -18px rgba(0,0,0,.85);overflow:hidden}
.parch-card::before{content:"";position:absolute;top:8px;right:8px;bottom:8px;left:8px;border:1px solid rgba(58,47,31,.2);border-radius:3px;pointer-events:none}
.seal{position:absolute;right:16px;top:16px;width:48px;height:48px;border:2px solid var(--gry);color:var(--gry);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1.1;text-align:center;transform:rotate(8deg);opacity:.85;padding:2px}

.char-portrait{width:190px;height:190px;margin:4px auto 0}
.char-img{display:block;width:190px;height:190px;object-fit:cover;border-radius:50%;background:#2a2145;border:3px solid rgba(58,47,31,.18)}
.face-fallback{display:block;width:190px;height:190px;line-height:190px;text-align:center;font-size:74px;background:#2a2145;border-radius:50%}
.char-name{font-size:30px;text-align:center;font-weight:700;letter-spacing:3px;color:var(--ink);margin-top:14px;line-height:1.4}
.char-en{text-align:center;font-size:12px;letter-spacing:3px;color:var(--ink-soft);text-transform:uppercase;margin-top:2px}
.char-tag{text-align:center;font-size:14px;color:#4a3d28;margin-top:12px;font-weight:600;line-height:1.7}
.char-verdict{margin-top:14px;padding:14px;background:rgba(58,47,31,.06);border-radius:8px;font-size:14px;line-height:1.9;color:var(--ink)}
.house-row{display:flex;align-items:center;margin-top:14px;padding:11px 13px;background:rgba(58,47,31,.05);border-radius:8px}
.house-dot{width:16px;height:16px;border-radius:50%;flex:none;margin-right:10px}
.house-row .ht{font-size:13px;color:var(--ink);min-width:0}
.house-row .hs{font-size:11px;color:var(--ink-soft);margin-left:auto;text-align:right;padding-left:10px}

/* ---------- result blocks ---------- */
.kv{margin-top:18px}
.kv .row{display:flex;padding:9px 0;border-bottom:1px dashed rgba(58,47,31,.15);font-size:13.5px}
.kv .k{color:var(--ink-soft);flex:none;width:76px;letter-spacing:1px;margin-right:12px}
.kv .v{color:var(--ink);min-width:0}
.block{margin-top:24px}
.bt-h{font-size:13px;letter-spacing:5px;color:var(--gold);margin-bottom:11px;display:flex;align-items:center}
.bt-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(212,175,55,.4),transparent);margin-left:10px}
.panel{background:rgba(255,255,255,.05);border:1px solid rgba(212,175,55,.18);border-radius:12px;padding:15px 16px;font-size:13.5px;color:var(--violet-soft);line-height:1.85}
.panel b{color:var(--gold-soft)}
.badge{display:inline-block;font-size:11px;letter-spacing:1px;padding:3px 9px;border-radius:12px;margin-right:6px;font-weight:600;vertical-align:middle}
.badge.gold{background:var(--gold);color:#1a1305}
.badge.rose{background:var(--rose);color:#3a1c24}
.badge.dim{background:rgba(255,255,255,.12);color:var(--violet-soft)}
.small{font-size:11.5px;color:var(--violet);line-height:1.7}
.small.hi{color:var(--violet-soft);font-size:13px;margin-top:6px}

.chips{display:flex;flex-wrap:wrap;margin-bottom:-7px}
.chip{padding:7px 11px;margin:0 7px 7px 0;border:1px solid rgba(212,175,55,.25);border-radius:18px;font-size:12px;color:var(--violet-soft);cursor:pointer;background:transparent;font-family:inherit;transition:border-color .18s,color .18s,background .18s}
.chip:active,.chip.on{border-color:var(--gold);color:#fff;background:rgba(212,175,55,.15)}

.meter{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--rose));width:0;transition:width 1s ease}

.grid16{display:grid;grid-template-columns:repeat(4,1fr);grid-gap:7px;gap:7px;margin-top:8px}
.gcell{border:1px solid rgba(212,175,55,.2);border-radius:9px;padding:6px 4px 8px;text-align:center;cursor:pointer;transition:border-color .18s,transform .18s;background:rgba(255,255,255,.03)}
.gcell:active{border-color:var(--gold);transform:translateY(-2px)}
.gcell img{display:block;width:100%;height:64px;object-fit:cover;border-radius:6px;background:#2a2145}
.gcell .face-fallback{width:100%;height:64px;line-height:64px;font-size:30px;border-radius:6px}
.gcell .n{font-size:10.5px;color:#a99cc9;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcell.me{border-color:var(--rose);background:rgba(232,165,181,.15)}

.hbar{display:flex;align-items:center;margin-bottom:7px;font-size:12px;color:var(--violet-soft)}
.hbar .nm{width:58px;flex:none;margin-right:9px}
.hbar .nm.end{width:auto;margin-right:0;margin-left:9px;text-align:right}
.hbar .tr{flex:1;height:7px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;min-width:0}
.hbar .tr i{display:block;height:100%;width:0;border-radius:4px;transition:width 1s ease}
.hbar .pc{width:38px;text-align:right;font-size:11px;color:var(--violet);margin-left:9px;flex:none}

/* ---------- result card (canvas) ---------- */
.card-stage{margin-top:12px;padding:12px;background:rgba(255,255,255,.05);border:1px solid rgba(212,175,55,.18);border-radius:12px;text-align:center}
.card-stage img{display:block;width:100%;max-width:300px;height:auto;margin:0 auto;border-radius:8px;background:var(--parch)}
.card-stage .tip{font-size:11.5px;color:var(--violet);margin-top:10px;line-height:1.7}
.row2{display:flex}
.row2 > .btn{flex:1;min-width:0}
.row2 > .btn + .btn{margin-left:10px}

/* ---------- roster ---------- */
.roster-item{display:flex;align-items:flex-start;padding:12px 0;border-bottom:1px dashed rgba(212,175,55,.18)}
.roster-item:last-child{border-bottom:none}
.roster-item img{width:60px;height:60px;object-fit:cover;border-radius:50%;flex:none;background:#2a2145;margin-right:12px}
.roster-item .face-fallback{width:60px;height:60px;line-height:60px;font-size:30px;border-radius:50%;flex:none;margin-right:12px}
.roster-item .meta{flex:1;min-width:0}
.roster-item .rn{font-size:15px;color:var(--gold-soft);font-weight:600}
.roster-item .rx{font-size:11.5px;color:var(--violet);line-height:1.6;margin-top:2px}
.roster-item .rt{font-size:13.5px;color:var(--parch);margin-top:6px;line-height:1.7}
.roster-item .rv{font-size:12px;color:#a99cc9;margin-top:4px;line-height:1.7}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);max-width:86%;padding:11px 18px;background:rgba(30,24,51,.96);border:1px solid rgba(212,175,55,.45);border-radius:22px;color:var(--gold-soft);font-size:13px;line-height:1.6;text-align:center;z-index:1100;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast[hidden]{display:none}

@media (hover:hover){
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(212,175,55,.4)}
  .btn.ghost:hover{background:rgba(212,175,55,.08)}
  .opt:hover{background:rgba(212,175,55,.1);border-color:var(--gold)}
  .chip:hover{border-color:var(--gold);color:#fff;background:rgba(212,175,55,.15)}
  .gcell:hover{border-color:var(--gold);transform:translateY(-2px)}
  .card-magic:hover{border-color:rgba(212,175,55,.4)}
}

/* 网页版：剪贴板不可用时给一块可长按选中的纯文本 */
.copy-box{width:100%;margin-top:10px;min-height:150px;padding:12px;background:rgba(255,255,255,.06);border:1px solid rgba(212,175,55,.28);border-radius:10px;color:#f3e9d2;font-size:13px;line-height:1.7;font-family:inherit;resize:none}

</style>
</head>

      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function renderQ() {
    if (qi >= 16) { doSelecting(); return; }
    var q = BANK[qi];
    var ax = AXES[Math.floor(qi / 4)];
    $('qProg').textContent = '第 ' + (qi + 1) + ' / 16 题 · ' + ax.name;
    $('qText').textContent = q.s;
    currentPair = shuffle(q.o);

    }
    var chosen = currentPair[i];
    var ax = Math.floor(qi / 4);
    if (chosen.v === AXES[ax].a) votes[ax]++;
    houseTally[chosen.h]++;
    buzz('light');
    castSpell();

    setTimeout(function () {
      qi++;

  var sparkSeq = 0;
  function castSpell() {
    var word = SPELLS[Math.floor(Math.random() * SPELLS.length)];
    $('spellWord').textContent = word + '!';
    var sparks = '';
    for (var i = 0; i < 6; i++) {

      var dy = Math.round(Math.random() * -120 - 20);
      sparks += '<span class="spell-spark" style="--dx:' + dx + 'px;--dy:' + dy + 'px;left:' +
        (45 + Math.random() * 10).toFixed(1) + '%;top:' + (40 + Math.random() * 10).toFixed(1) + '%">✨</span>';

    cat.style.animation = 'none';

  /* ============ 配对 ============ */
  function pairText(myCode, otherCode) {
    var A = CHARS[myCode], B = CHARS[otherCode];
    var same = 0;
    for (var i = 0; i < 4; i++) if (myCode.charAt(i) === otherCode.charAt(i)) same++;
    var diff = 4 - same;
    if (same === 4) return { t: '同一个人', s: 95, d: '完全同轴。你们要么成为最好的搭档，要么成为最烦对方的镜子 —— 因为你们最看不惯对方的地方，自己身上也有。' };
    if (diff === 1) return { t: '高契合', s: 88, d: '只差一条轴。' + A.n + ' 和 ' + B.n + ' 在故事里通常是并肩出现的那种 —— 一个冲动的时候另一个刚好踩得住。' };
    if (diff === 2) return { t: '互补型', s: 74, d: '两条轴相反。你们的用法是“分工”：' + A.tag + ' × ' + B.tag + '。硬要干同一件事就会吵架。' };
    if (diff === 3) return { t: '需要翻译', s: 55, d: '三条轴不同。你们做同一个决定的路径完全相反 —— 能玩到一起靠的不是相似，是好奇。' };
    return { t: '镜像对', s: 42, d: '四条轴全反。你们几乎是同一个人的两个版本。故事里这种组合通常一个活到结尾，另一个死在第七部。' };

  /* ============ Canvas 结果卡 ============ */
  var CARD_W = 750, CARD_H = 1000;
  var FONT = '"Songti SC","STSong","Noto Serif CJK SC","Microsoft YaHei",sans-serif';

  function wrapText(g, text, maxWidth, maxLines) {
    var out = [];
    var line = '';
    for (var i = 0; i < text.length; i++) {
      var test = line + text.charAt(i);
      if (g.measureText(test).width > maxWidth && line) {
        out.push(line);
        line = text.charAt(i);
        if (out.length === maxLines) {
          out[maxLines - 1] = out[maxLines - 1].slice(0, -1) + '…';
          return out;
        }
      } else {
        line = test;
      }
    }
    if (line) out.push(line);
    if (out.length > maxLines) {
      out = out.slice(0, maxLines);
      out[maxLines - 1] = out[maxLines - 1].slice(0, -1) + '…';
    }
    return out;
  }

  function paintCard(canvas, r, faceImg) {
    var g = canvas.getContext('2d');
    var C = r.ch, H = HOUSES[r.house];

    var bg = g.createLinearGradient(0, 0, CARD_W, CARD_H);
    bg.addColorStop(0, '#f6eeda');
    bg.addColorStop(1, '#e3d2ab');
    g.fillStyle = bg;
    g.fillRect(0, 0, CARD_W, CARD_H);

    g.strokeStyle = 'rgba(58,47,31,.28)';
    g.lineWidth = 2;
    g.strokeRect(26, 26, CARD_W - 52, CARD_H - 52);

    g.textAlign = 'center';
    g.fillStyle = '#6b5d45';
    g.font = '26px ' + FONT;
    g.fillText('你 是 霍 格 沃 茨 的 谁', CARD_W / 2, 96);

    /* 圆形卡通形象 */
    var cx = CARD_W / 2, cy = 330, rad = 190;
    g.save();
    g.beginPath();
    g.arc(cx, cy, rad, 0, Math.PI * 2);
    g.closePath();
    g.clip();
    if (faceImg && faceImg.width) {
      g.drawImage(faceImg, cx - rad, cy - rad, rad * 2, rad * 2);
    } else {
      g.fillStyle = '#2a2145';
      g.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
      g.fillStyle = '#e8c96a';
      g.font = '120px ' + FONT;
      g.fillText(C.face, cx, cy + 44);
    }
    g.restore();

    g.strokeStyle = H.color;
    g.lineWidth = 10;
    g.beginPath();
    g.arc(cx, cy, rad + 6, 0, Math.PI * 2);
    g.stroke();

    g.fillStyle = '#3a2f1f';
    g.font = 'bold 62px ' + FONT;
    g.fillText(C.n, cx, 600);

    g.fillStyle = '#6b5d45';
    g.font = '26px ' + FONT;
    g.fillText(C.en.toUpperCase(), cx, 640);

    g.fillStyle = '#4a3d28';
    g.font = '32px ' + FONT;
    var tagLines = wrapText(g, '「 ' + C.tag + ' 」', CARD_W - 140, 2);
    tagLines.forEach(function (t, i) { g.fillText(t, cx, 700 + i * 44); });

    g.strokeStyle = 'rgba(58,47,31,.2)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(120, 800);
    g.lineTo(CARD_W - 120, 800);
    g.stroke();

    g.fillStyle = H.color;
    g.font = 'bold 34px ' + FONT;
    g.fillText('分院 · ' + H.name, cx, 856);

    g.fillStyle = '#5a4a33';
    g.font = '26px ' + FONT;
    var body = wrapText(g, C.verdict, CARD_W - 150, 3);
    body.forEach(function (t, i) { g.fillText(t, cx, 906 + i * 38); });

    g.fillStyle = '#9b8a6d';
    g.font = '22px ' + FONT;
    g.fillText('魔 法 测 格', cx, CARD_H - 46);
  }

  function exportCard(canvas) {
    /* 卡片不透明，用 JPEG 把跨桥字符串压到 PNG 的几分之一 */
    try {
      var url = canvas.toDataURL('image/jpeg', 0.9);
      if (url && url.indexOf('data:image/jpeg') === 0) return url;
      return canvas.toDataURL('image/png');
    } catch (e) {
      /* 包内图片可能污染画布，读不回时由调用方降级到无图片分享 */
      return '';
    }
  }

  function makeCard() {
    if (!lastResult) return Promise.resolve('');
    var code = lastResult.code;
    if (cardCache.code === code && cardCache.dataUrl) return Promise.resolve(cardCache.dataUrl);
    if (cardCache.drawing) return cardCache.drawing;

    var r = { ch: CHARS[code], house: lastResult.house };
    var canvas = document.createElement('canvas');
    canvas.width = CARD_W;
    canvas.height = CARD_H;

    cardCache.drawing = new Promise(function (resolve) {
      var settled = false;
      var finish = function (img) {
        if (settled) return;
        settled = true;
        paintCard(canvas, r, img);
        var url = exportCard(canvas);
        cardCache.code = code;
        cardCache.dataUrl = url;
        cardCache.drawing = null;
        var stage = $('cardStage');
        if (url && stage) {
          var caps = document.querySelectorAll('#s-res [data-cap]');
          var capReady = false;
          for (var ci = 0; ci < caps.length; ci++) if (!caps[ci].hidden) capReady = true;
          stage.innerHTML = '<img src="' + url + '" alt="我的结果卡">' +
            '<div class="tip">' + (IS_WEB ? '长按上面的图就能保存，或用下面的按钮。'
            : (capReady ? '用下面的按钮存相册或发成笔记。' : '把这一屏截图就能保存。')) + '</div>';
        } else if (stage) {
          stage.innerHTML = '<div class="small">当前环境不允许导出图片，直接截图这一页也能保存。</div>';
        }
        resolve(url);
      };
      var img = new Image();
      img.onload = function () { finish(img); };
      img.onerror = function () { finish(null); };
      img.src = charSrc(code);
      setTimeout(function () { finish(null); }, 4000);
    });
    return cardCache.drawing;
  }

  /* ============ 端能力动作 ============ */
  function tempFileFrom(dataUrl) {
    if (cardCache.filePath) return Promise.resolve(cardCache.filePath);
    if (!hasApi('writeTempFile')) return Promise.resolve('');
    return call('writeTempFile', { data: dataUrl }).then(function (res) {
      var p = res && res.filePath;
      if (p) cardCache.filePath = p;
      return p || '';
    }, function () { return ''; });
  }

  function actMakeCard() {
    makeCard().then(function (url) {
      if (!url) toast('这个环境导不出图片，截图这一页也能保存');
    });
  }

  function actAlbum() {
    makeCard().then(function (url) {
      if (!url) { toast('先截图这一页吧'); return; }
      tempFileFrom(url).then(function (path) {
        return call('saveImageToPhotosAlbum', { filePath: path || url });
      }).then(function () {
        toast('已存到相册');
      }, function (err) {
        toast(saveFailReason(err));
      });
    });
  }

  function saveFailReason(err) {
    var msg = (err && err.errMsg) || '';
    if (/deny|denied|auth|permission/i.test(msg)) return '相册权限被拒绝了';
    return '没能存进相册，再试一次';
  }

  function actNote() {
    makeCard().then(function (url) {
      if (!url) { toast('这个环境导不出图片，换个方式分享吧'); return; }
      tempFileFrom(url).then(function (path) {
        var ch = CHARS[lastResult.code];
        return call('postNote', {
          title: '我是' + ch.n,
          content: resultText({ ch: ch, house: lastResult.house }) + '\n你也来测测自己是霍格沃茨的谁。',
          pageType: 'photo_publish',
          mediaInfo: { image_resources: [{ url: path || url }] }
        });
      }).then(function () {
        toast('已带到发布页');
      }, function () {
        toast('发布页没能打开');
      });
    });
  }

  function actComment() {
    var snapshot = JSON.stringify({ v: 1, code: lastResult.code, house: lastResult.house });
    makeCard().then(function (url) {
      return url ? tempFileFrom(url) : '';
    }).then(function (path) {
      var payload = {
        action: 'post_comment',
        content: '我测出来是' + CHARS[lastResult.code].n + '，你是哪个？',
        miniToolSnapshotInfo: snapshot
      };
      if (path) payload.media_bean = [{ media_type: 'image', cover_image_url: path }];
      return call('interactionOpenApi', { payload: payload, saveToAlbum: false });
    }).then(function (res) {
      if (res && res.routed === false) toast('评论区没打开');
    }, function () {
      toast('评论区没打开');
    });
  }

  function actShareCard() {
    call('share', { type: 'card' }).then(function () {
      toast('已拉起分享');
    }, function (err) {
      var code = err && err.errCode;
      if (code === 15503) toast('今天分享次数用完啦');
      else if (code === 15502) toast('当前窗口形态不支持分享');
      else toast('分享没打开');
    });
  }

  /* ============ 网页版动作 ============ */
  function actCopyText() {
    var text = resultText({ ch: CHARS[lastResult.code], house: lastResult.house }) +
      '\n—— 你也来测：' + SHARE_URL;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制，去评论区贴给好友。'); },
        function () { legacyCopy(text); });
    } else { legacyCopy(text); }
  }
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? '已复制，去评论区贴给好友。' : '复制没成功，长按下面文字复制。');
    showCopyBox(text);
  }
  function showCopyBox(text) {
    var stage = $('cardStage');
    if (!stage || stage.querySelector('.copy-box')) return;
    var box = document.createElement('textarea');
    box.className = 'copy-box';
    box.setAttribute('readonly', '');
    box.value = text;
    stage.appendChild(box);
    box.focus();
    box.select();
  }
  function actDownload() {
    makeCard().then(function (url) {
      if (!url) { toast('这个浏览器导不出图片，长按页面里的图试试'); return; }
      var a = document.createElement('a');
      a.href = url;
      a.download = 'magic-card-' + lastResult.code + '.jpg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      toast('已下载结果卡');
    });
  }

  /* ============ 事件绑定（全部 addEventListener，无行内事件） ============ */
  var ACTIONS = {
    start: function () { startQuiz(); },
    roster: renderRoster,
    home: function () { show('s-intro'); },
    makecard: actMakeCard,
    album: actAlbum,
    note: actNote,
    comment: actComment,
    sharecard: actShareCard,
    copytext: actCopyText,
    download: actDownload
  };

  document.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t.nodeType === 1) {
      if (t.hasAttribute('data-act')) { ACTIONS[t.getAttribute('data-act')](); return; }
      if (t.hasAttribute('data-i')) { pick(Number(t.getAttribute('data-i'))); return; }
      if (t.hasAttribute('data-pair')) { doPair(t.getAttribute('data-pair')); return; }
      if (t.hasAttribute('data-peek')) { peek(t.getAttribute('data-peek')); return; }
      t = t.parentNode;
    }
  });

  /* 形象图随主包下发，但仍可能被系统清理或解码失败，加载不到时用表情符号占位 */
  document.addEventListener('error', function (e) {
    var t = e.target;
    if (!t || t.tagName !== 'IMG' || !t.hasAttribute('data-face')) return;
    if (!t.parentNode) return;
    var holder = document.createElement('div');
    holder.className = 'face-fallback';
    holder.textContent = t.getAttribute('data-face');
    t.parentNode.replaceChild(holder, t);
  }, true);

  function startQuiz() {
    qi = 0;
    votes = [0, 0, 0, 0];
    lines = [null, null, null, null];
    houseTally = { gry: 0, sly: 0, rav: 0, huf: 0 };
    cardCache.code = '';
    cardCache.dataUrl = '';
    cardCache.filePath = '';
    show('s-quiz');
    renderRunes();
    renderQ();
  }

  /* ============ 首屏 ============ */
  function makeStars() {
    var box = $('stars');
    var frag = document.createDocumentFragment();
    for (var i = 0; i < 40; i++) {
      var s = document.createElement('div');
      s.className = 'star';
      var sz = (Math.random() * 2 + 1).toFixed(1);
      s.style.width = sz + 'px';
      s.style.height = sz + 'px';
      s.style.left = (Math.random() * 100).toFixed(1) + '%';
      s.style.top = (Math.random() * 100).toFixed(1) + '%';
      s.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
      frag.appendChild(s);
    }
    box.appendChild(frag);
  }

  function renderLastResult(saved) {
    var box = $('lastResult');
    if (!saved) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = '上次你是 <b>' + CHARS[saved.code].n + '</b>，分进了 <b>' + HOUSES[saved.house].name + '</b>。' +
      '<div class="small" style="margin-top:6px">再测一次看看会不会变。</div>';
  }

  /* 从评论区回来时，容器可能带回 interactionOpenApi 写入的附加状态；取不到就用本地缓存 */
  function readSnapshot() {
    var lo = window.xhs && window.xhs.launchOptions;
    var raw = lo && lo.miniToolSnapshotInfo;
    if (typeof raw !== 'string' || !raw) return null;
    try {
      var obj = JSON.parse(raw);
      return obj && CHARS[obj.code] ? { code: obj.code, house: obj.house, votes: [2, 2, 2, 2], tally: null, pureCount: 0 } : null;
    } catch (e) { return null; }
  }

  function boot() {
    makeStars();
    measureAppHeight();
    var snapshot = readSnapshot();
    /* 版本号必须先解析出来，能力探测才有依据 */
    getBuildVersion().then(function (v) {
      buildVersion = v;
      applyWindowInfo();
      return loadLocal();
    }).then(function (saved) {
      var data = saved || snapshot;
      if (data) {
        lastResult = data;
        renderLastResult(data);
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
