<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小猫起卦 · 喵星测格</title>
<style>
:root{
  --cream:#fef5f0;
  --pink:#f8e8f0;
  --rose:#e8a5b5;
  --rose-deep:#d48a9a;
  --beige:#d4a574;
  --brown:#5a4a42;
  --brown-light:#8b7a6f;
  --white:#fff;
  --shadow:rgba(90,74,66,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  background:linear-gradient(160deg,var(--cream) 0%,var(--pink) 100%);
  color:var(--brown);
  line-height:1.8;
  overflow-x:hidden;
  min-height:100vh;
}
#app{position:relative;max-width:440px;margin:0 auto;min-height:100%;padding:20px}
.screen{display:none;animation:fadeUp .5s ease both}
.screen.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

.cat{font-size:64px;text-align:center;margin:20px 0;animation:bounce 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.paw{font-size:24px;opacity:.6;display:inline-block;animation:pawStep 1.5s ease-in-out infinite}
@keyframes pawStep{0%,100%{opacity:.3;transform:scale(.9)}50%{opacity:.8;transform:scale(1.1)}}

/* Logo */
.logo{display:flex;flex-direction:column;align-items:center;margin:24px 0 16px}
.logo-icon{width:200px;height:200px;position:relative;margin-bottom:12px;animation:logoFloat 3s ease-in-out infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(2deg)}}
.logo-icon img{width:100%;height:100%;object-fit:contain}
.logo-text{font-size:32px;font-weight:700;color:var(--rose-deep);letter-spacing:8px;text-shadow:0 2px 8px rgba(232,165,181,.3)}

/* Cat expressions */
.cat-expr{display:inline-block;position:relative}
.cat-expr img{width:120px;height:120px;object-fit:contain}
.cat-expr.thinking{animation:catThink 2s ease-in-out infinite}
@keyframes catThink{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.cat-expr.shaking{animation:catShake 0.3s ease-in-out infinite}
@keyframes catShake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-5px) rotate(-10deg)}75%{transform:translateX(5px) rotate(10deg)}}
.cat-expr.surprised{animation:catSurprise 1s ease-in-out infinite}
@keyframes catSurprise{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.cat-expr.proud{animation:catProud 2s ease-in-out infinite}
@keyframes catProud{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px) rotate(3deg)}}

/* Quiz cat mascot */
.quiz-cat{position:fixed;bottom:20px;right:20px;z-index:100;pointer-events:none;animation:catPeek 3s ease-in-out infinite}
.quiz-cat img{width:60px;height:60px;object-fit:contain;border-radius:50%;background:var(--white);box-shadow:0 4px 12px var(--shadow)}
@keyframes catPeek{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(5deg)}}

/* Casting animation */
.cast-scene{text-align:center;padding:60px 20px}
.cast-cat{display:inline-block;position:relative}
.cast-cat img{width:150px;height:150px;object-fit:contain;animation:castShake 0.6s ease-in-out infinite}
@keyframes castShake{0%,100%{transform:rotate(-5deg) translateY(0)}25%{transform:rotate(5deg) translateY(-10px)}50%{transform:rotate(-5deg) translateY(0)}75%{transform:rotate(5deg) translateY(-10px)}}

/* Dice rolling animation */
.dice-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(254,245,240,.9);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dice-container{position:relative;width:200px;height:200px}
.dice{position:absolute;width:60px;height:60px;background:var(--white);border-radius:12px;box-shadow:0 8px 24px var(--shadow);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:var(--rose-deep);animation:diceRoll 0.8s cubic-bezier(.34,1.56,.64,1)}
.dice:nth-child(1){top:20px;left:20px;animation-delay:0s}
.dice:nth-child(2){top:20px;right:20px;animation-delay:.1s}
.dice:nth-child(3){bottom:20px;left:20px;animation-delay:.2s}
.dice:nth-child(4){bottom:20px;right:20px;animation-delay:.3s}
@keyframes diceRoll{0%{transform:translateY(-100px) rotate(0deg);opacity:0}50%{transform:translateY(20px) rotate(360deg);opacity:1}70%{transform:translateY(-10px) rotate(540deg)}100%{transform:translateY(0) rotate(720deg);opacity:1}}
.dice-result{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;animation:popIn .4s ease .6s both}
@keyframes popIn{from{transform:translate(-50%,-50%) scale(0);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}

/* Speech bubble */
.speech{position:relative;background:var(--white);border-radius:20px;padding:12px 18px;margin:16px auto;max-width:280px;box-shadow:0 4px 16px var(--shadow);font-size:14px;color:var(--brown);text-align:center}
.speech::after{content:"";position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);border:10px solid transparent;border-top-color:var(--white)}

.title{text-align:center;font-size:28px;font-weight:600;color:var(--rose-deep);letter-spacing:6px;margin:16px 0 8px}
.subtitle{text-align:center;font-size:13px;color:var(--brown-light);letter-spacing:3px;margin-bottom:24px}
.card-intro{background:var(--white);border-radius:20px;padding:28px 24px;box-shadow:0 8px 32px var(--shadow);margin-bottom:20px}
.lede{font-size:15px;color:var(--brown);text-align:center;margin-bottom:20px;line-height:1.9}
.lede b{color:var(--rose-deep);font-weight:600}
.steps{list-style:none;margin:20px 0}
.steps li{position:relative;padding:12px 16px 12px 48px;margin-bottom:10px;background:rgba(232,165,181,.08);border-radius:12px;font-size:14px;color:var(--brown);line-height:1.7}
.steps li::before{content:"🐾";position:absolute;left:16px;top:12px;font-size:18px}
.steps li b{color:var(--rose-deep);font-weight:600}
.btn{display:block;width:100%;margin-top:20px;padding:16px;background:linear-gradient(135deg,var(--rose) 0%,var(--rose-deep) 100%);color:var(--white);border:none;border-radius:30px;font-family:inherit;font-size:16px;font-weight:600;letter-spacing:6px;cursor:pointer;box-shadow:0 6px 20px rgba(232,165,181,.4);transition:all .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,165,181,.5)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;border:2px solid var(--rose);color:var(--rose-deep);letter-spacing:3px;box-shadow:none;font-size:14px;padding:13px}
.btn.ghost:hover{background:rgba(232,165,181,.1)}
.disc{margin-top:16px;font-size:11px;color:var(--brown-light);text-align:center;letter-spacing:1px;line-height:1.6}

.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:12px 16px;background:var(--white);border-radius:14px;box-shadow:0 2px 12px var(--shadow)}
.qnum{font-size:12px;color:var(--brown-light);letter-spacing:1px}
.axes{display:flex;gap:5px}
.axis{width:28px;height:4px;background:rgba(232,165,181,.2);border-radius:2px}
.axis.done{background:var(--rose)}
.axis.cur{background:var(--beige);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.yaoBox{display:flex;flex-direction:column-reverse;align-items:center;gap:10px;padding:20px 0;min-height:110px}
.yao{width:110px;height:14px;display:flex;gap:14px;opacity:0;transform:scale(.5) rotate(-10deg);transition:.6s cubic-bezier(.34,1.56,.64,1)}
.yao.show{opacity:1;transform:none}
.yao i{height:14px;background:var(--rose);display:block;border-radius:7px;box-shadow:0 2px 8px rgba(232,165,181,.3)}
.yao.yang i:first-child{flex:1}
.yao.yin i:first-child{flex:.42}
.yao.yin i:last-child{flex:.42}
.yao.lao i{background:var(--beige);box-shadow:0 2px 10px rgba(212,165,116,.4)}
.ylabel{font-size:11px;color:var(--brown-light);text-align:center;letter-spacing:2px;margin-top:4px}
.qcard{background:var(--white);border-radius:18px;padding:24px 20px;box-shadow:0 4px 20px var(--shadow);margin-bottom:16px}
.qtext{font-size:17px;line-height:1.8;margin-bottom:20px;color:var(--brown);font-weight:500}
.opt{display:block;width:100%;text-align:left;margin-bottom:12px;padding:14px 16px;background:rgba(232,165,181,.06);border:2px solid rgba(232,165,181,.2);color:var(--brown);font-family:inherit;font-size:14.5px;line-height:1.7;border-radius:12px;cursor:pointer;transition:all .2s}
.opt:hover{background:rgba(232,165,181,.12);border-color:var(--rose);transform:translateX(4px)}
.opt.sel{background:var(--rose);border-color:var(--rose-deep);color:var(--white)}
.qhint{font-size:11px;color:var(--brown-light);text-align:center;letter-spacing:2px;margin-top:8px}

#cast{text-align:center;padding-top:80px}
#cast .spin{font-size:90px;display:inline-block;animation:spin 1.8s ease-in-out}
@keyframes spin{0%{transform:rotate(0) scale(.5);opacity:0}30%{opacity:1}100%{transform:rotate(720deg) scale(1);opacity:1}}
#cast p{margin-top:24px;letter-spacing:5px;color:var(--brown-light);font-size:14px}

.card{background:var(--white);border-radius:22px;padding:28px 22px 24px;position:relative;overflow:hidden;box-shadow:0 12px 40px var(--shadow)}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--rose),var(--beige),var(--rose))}
.card .tri{display:flex;flex-direction:column-reverse;align-items:center;gap:9px;margin:16px 0}
.card .tri .yao{width:90px}
.card .tri .yao i{background:var(--brown)}
.card .tri .yao.lao i{background:var(--rose-deep)}
.gname{font-size:30px;text-align:center;letter-spacing:3px;font-weight:700;color:var(--rose-deep);margin-top:8px}
.ghex{text-align:center;font-size:14px;color:var(--brown-light);letter-spacing:2px;margin-top:4px}
.tagline{text-align:center;font-size:14px;color:var(--brown);margin-top:14px;padding:0 8px;font-weight:500}
.verdict{margin-top:18px;padding:16px;background:rgba(232,165,181,.06);border-radius:12px;font-size:14px;color:var(--brown);line-height:1.9}
.wxrow{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;background:rgba(212,165,116,.1);border-radius:10px}
.dot{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.wxrow .t1{font-size:13px;color:var(--brown);font-weight:500}
.wxrow .t2{font-size:11px;color:var(--brown-light);margin-left:auto;letter-spacing:1px}
.seal{position:absolute;right:16px;top:16px;width:48px;height:48px;background:var(--rose);color:var(--white);border-radius:50%;font-size:14px;line-height:1.2;text-align:center;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(232,165,181,.4);transform:rotate(8deg)}
.kv{margin-top:20px}
.kv .row{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed rgba(232,165,181,.2);font-size:13.5px}
.kv .k{color:var(--brown-light);flex:none;width:60px;letter-spacing:1px;font-weight:500}
.kv .v{color:var(--brown);line-height:1.7}
.badge{display:inline-block;font-size:11px;letter-spacing:1px;padding:3px 9px;border-radius:12px;margin-right:6px;font-weight:500}
.badge.rose{background:var(--rose);color:var(--white)}
.badge.beige{background:var(--beige);color:var(--white)}
.badge.brown{background:var(--brown);color:var(--white)}
.small{font-size:11.5px;color:var(--brown-light);line-height:1.7}
.block{margin-top:24px}
.bt{font-size:14px;letter-spacing:4px;color:var(--rose-deep);margin-bottom:12px;display:flex;align-items:center;gap:10px;font-weight:600}
.bt::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--rose),transparent)}
.panel{background:var(--white);border-radius:14px;padding:16px;box-shadow:0 2px 12px var(--shadow);font-size:14px;color:var(--brown);line-height:1.8}
.panel b{color:var(--rose-deep);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:8px 12px;border:2px solid rgba(232,165,181,.3);border-radius:20px;font-size:12.5px;color:var(--brown);cursor:pointer;background:var(--white);font-family:inherit;transition:all .2s;font-weight:500}
.chip:hover,.chip.on{border-color:var(--rose);color:var(--rose-deep);background:rgba(232,165,181,.1)}
.meter{height:6px;background:rgba(232,165,181,.15);border-radius:3px;overflow:hidden;margin:10px 0 14px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--beige));width:0;transition:width 1s ease;border-radius:3px}
.grid8{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.gcell{border:2px solid rgba(232,165,181,.2);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;transition:all .2s;background:var(--white)}
.gcell:hover{border-color:var(--rose);transform:translateY(-2px);box-shadow:0 4px 12px var(--shadow)}
.gcell .s{font-size:24px;line-height:1.2}
.gcell .n{font-size:11px;color:var(--brown-light);margin-top:2px;letter-spacing:1px}
.gcell.me{border-color:var(--rose-deep);background:rgba(232,165,181,.15)}
</style>
</head>
<body>
<div id="app">

<section class="screen on" id="s-intro">
  <div class="logo">
    <div class="logo-icon">
      <img src="images/logo.jpg" alt="小猫起卦">
    </div>
    <div class="logo-text">小猫起卦</div>
  </div>
  <div class="subtitle">喵 星 测 格 · 八 型 五 运</div>
  <div class="card-intro">
    <p class="lede">小猫说：<b>MBTI 用四条轴切出 16 型</b><br>我们用<b>三爻</b>，摇出你的<b>本命格</b>喵～</p>
    <ul class="steps">
      <li>三爻对应三才：<b>起手式</b>（地）、<b>能量朝向</b>（人）、<b>与世界</b>（天）</li>
      <li>每爻由 5 道题投票生成，合出来是一卦 —— 你的<b>本命格</b>，八个之一喵</li>
      <li>每道题的选项还带着<b>金木水火土</b>。累加最高的那个，是你<b>这一阵子的运</b></li>
      <li>若某一组五题全选同一边，那爻为<b>老</b>，会变卦 —— 四千人里难出一个哦</li>
    </ul>
    <button class="btn" onclick="startQuiz()">起&nbsp;卦&nbsp;喵</button>
    <button class="btn ghost" onclick="openAtlas()">先看八卦谱系</button>
    <p class="disc">娱乐向自我观察工具 · 非命理预测 · 结果不构成任何决策建议</p>
  </div>
</section>

<section class="screen" id="s-quiz">
  <div class="quiz-cat">
    <img src="images/1.gif" alt="思考猫">
  </div>
  <div class="qhead">
    <div class="qnum" id="qProg">第 1 / 15 题</div>
    <div class="axes" id="qAxes"></div>
  </div>
  <div class="yaoBox">
    <div id="yaoStack"></div>
    <div class="ylabel" id="yLabel"></div>
  </div>
  <div class="qcard">
    <div class="qtext" id="qText"></div>
    <div id="qOpts"></div>
    <div class="qhint" id="qHint"></div>
  </div>
  <div style="text-align:center;margin:16px 0">
    <span class="paw">🐾</span>
    <span class="paw" style="animation-delay:.3s">🐾</span>
    <span class="paw" style="animation-delay:.6s">🐾</span>
  </div>
</section>

<section class="screen" id="s-cast">
  <div class="cast-scene">
    <div style="position:relative;display:inline-block">
      <span class="cast-sparkle">✨</span>
      <span class="cast-sparkle">⭐</span>
      <span class="cast-sparkle">✨</span>
      <span class="cast-sparkle">⭐</span>
      <div class="cast-cat">
        <img src="images/2.gif" alt="摇卦猫">
      </div>
    </div>
    <div class="cast-text">小猫在摇卦喵...</div>
  </div>
</section>

<section class="screen" id="s-res"></section>
<section class="screen" id="s-atlas"></section>

</div>

<script>
const AXES = [
  { key:'chu',   pos:'初爻', cai:'地', dim:'起手式', yang:'起', yin:'承', desc:'先出手，还是先接住' },
  { key:'zhong', pos:'中爻', cai:'人', dim:'能量朝向', yang:'显', yin:'藏', desc:'摊开来说，还是自己消化' },
  { key:'shang', pos:'上爻', cai:'天', dim:'与世界', yang:'塑', yin:'随', desc:'改造环境，还是适应环境' }
];

const BANK = [
  /* --- 初爻 · 起/承 --- */
  { a:'闺蜜突然发消息说心情不好', o:[
    {t:'立刻打电话过去问怎么了', yan:'yang', wx:'火'},
    {t:'先想想她最近是不是遇到什么事了', yan:'yin', wx:'土'} ]},
  { a:'在商场看到一件超好看但有点贵的衣服', o:[
    {t:'先试穿，好看就买', yan:'yang', wx:'金'},
    {t:'先逛逛别的店，回来再说', yan:'yin', wx:'水'} ]},
  { a:'朋友聚会，发现有个陌生人', o:[
    {t:'主动过去打招呼聊天', yan:'yang', wx:'木'},
    {t:'先观察一下，等别人介绍', yan:'yin', wx:'土'} ]},
  { a:'和男朋友/暧昧对象吵架了', o:[
    {t:'直接说清楚，把问题摊开', yan:'yang', wx:'火'},
    {t:'先冷静一下，想想谁的问题', yan:'yin', wx:'水'} ]},
  { a:'周末突然有空，没人约', o:[
    {t:'马上计划出去浪', yan:'yang', wx:'木'},
    {t:'先宅着，看心情再说', yan:'yin', wx:'土'} ]},

  /* --- 中爻 · 显/藏 --- */
  { a:'今天化了个超满意的妆', o:[
    {t:'疯狂自拍发朋友圈', yan:'yang', wx:'火'},
    {t:'自己照镜子欣赏，不一定要发', yan:'yin', wx:'土'} ]},
  { a:'被人夸「你今天好漂亮」', o:[
    {t:'开心地说「谢谢！我也觉得」', yan:'yang', wx:'金'},
    {t:'表面淡定，心里乐开花', yan:'yin', wx:'水'} ]},
  { a:'看到朋友发了很美的旅行照', o:[
    {t:'直接评论「好美！求带」', yan:'yang', wx:'木'},
    {t:'默默点赞，私聊问她好不好玩', yan:'yin', wx:'水'} ]},
  { a:'工作上被老板当众表扬', o:[
    {t:'大方说谢谢，分享经验', yan:'yang', wx:'火'},
    {t:'谦虚一下，回去再细想', yan:'yin', wx:'土'} ]},
  { a:'心里有个小秘密', o:[
    {t:'找最信任的人说出来', yan:'yang', wx:'金'},
    {t:'写在日记里，自己消化', yan:'yin', wx:'木'} ]},

  /* --- 上爻 · 塑/随 --- */
  { a:'合租的室友总是不收拾厨房', o:[
    {t:'直接贴个值日表在墙上', yan:'yang', wx:'金'},
    {t:'自己多收拾，等她不好意思', yan:'yin', wx:'水'} ]},
  { a:'去一家新开的网红店，排队超长', o:[
    {t:'改天早点来，一定要吃到', yan:'yang', wx:'木'},
    {t:'算了，换一家差不多的', yan:'yin', wx:'土'} ]},
  { a:'发现男朋友有个小毛病', o:[
    {t:'直接说，让他改', yan:'yang', wx:'火'},
    {t:'慢慢引导，或者自己适应', yan:'yin', wx:'水'} ]},
  { a:'计划好的旅行突然下雨', o:[
    {t:'改行程，找室内活动', yan:'yang', wx:'金'},
    {t:'雨中漫步，也挺浪漫', yan:'yin', wx:'木'} ]},
  { a:'公司新来了个领导，风格和你不合', o:[
    {t:'找机会聊聊，看看能不能磨合', yan:'yang', wx:'火'},
    {t:'先观察，调整自己的方式', yan:'yin', wx:'土'} ]}
];

const QLIST = [];
BANK.forEach(q=>{
  if(q.a) QLIST.push({stem:q.a, opts:q.o});
  else QLIST.push({stem:q.o[0].t, opts:q.alt});

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

  const box=document.getElementById('yaoStack');

  document.getElementById('yLabel').textContent = done? AXES[done-1].pos+' 已成 · '+AXES[done-1].dim : '三爻将自下而上生成喵';

function renderQ(){
  if(qi>=15){ cast(); return; }
  const {stem,opts}=QLIST[qi];
  const ax=AXES[Math.floor(qi/5)];
  document.getElementById('qProg').textContent = `第 ${qi+1} / 15 题 · ${ax.pos}`;
  document.getElementById('qText').textContent = stem;
  const pair = shuffle([...opts]);
  document.getElementById('qOpts').innerHTML = pair.map((o,i)=>
    `<button class="opt" onclick="pick(${i},'${o.yan}','${o.wx}')">${o.t}</button>`).join('');
  document.getElementById('qHint').textContent = ax.dim+' · '+ax.desc;
  renderAxisBar();
}
function pick(i,yan,wx){
  document.querySelectorAll('.opt').forEach((b,bi)=>b.classList.toggle('sel',bi===i));
  const ax=Math.floor(qi/5);
  if(yan==='yang') votes[ax]++;
  tally[wx]++;
  
  // Show dice rolling animation
  showDiceRoll(yan);
  
  setTimeout(()=>{
    qi++;
    if(qi%5===0){
      const v=votes[ax];
      lines.push({ yang: v>=3, lao: (v===5||v===0) });
      renderYaos();
    }
    renderQ();
  },1000);
}

  const diceValues = yan==='yang' ? [1,3,5,6] : [2,4,6,6];
  const resultEmoji = yan==='yang' ? '☀️' : '🌙';
  const overlay = document.createElement('div');

  document.body.appendChild(overlay);
  setTimeout(()=>overlay.remove(), 900);
}

function compute(){
  const code = lines.map(l=>l.yang?'1':'0').join('');
  const type = TYPES[code];
  let best = WX_ORDER[0]; WX_ORDER.forEach(w=>{ if(tally[w]>tally[best]) best=w; });
  const laos = lines.map((l,i)=>l.lao?AXES[i].key:null).filter(Boolean);
  const flipped = lines.map(l=>l.lao?(l.yang?'0':'1'):(l.yang?'1':'0')).join('');
  return {code,type,wx:best,laos,flipCode:flipped,flipType:TYPES[flipped]};
}

        本型八型均分，单看型不稀有。稀有度全在下面三层喵：<br>
        <span class="badge brown">变爻 ${laon?laon+' 爻':'无'}</span>
        至少一爻变 ≈ 17.7% ｜ 三爻皆变 ≈ 0.024%（约四千人一个）<br>
        <span class="badge ${guiwei?'beige':'brown'}">归位 ${guiwei?'成':'未'}</span>
        当运与本命同气 ≈ 20%<br>
        <span class="badge ${laon&&guiwei?'beige':'brown'}">你的组合</span>
        ${laon&&guiwei?'变爻 + 归位同时出现，约 3.5%':'变爻与归位同时出现 ≈ 3.5%'}
      </div>
    </div>

    <div class="block">
      <div class="bt">配 一 下 🐱</div>
      <div class="panel" style="padding-bottom:12px">
        <div class="small">选对方的本命格，按你们的卦德五行算关系喵。</div>
        <div class="chips" id="pairChips"></div>
        <div id="pairOut"></div>
      </div>
    </div>

    <div class="block">
      <div class="bt">全 部 八 格</div>
      <div class="grid8">${Object.entries(TYPES).map(([c,t])=>
        `<div class="gcell ${c===r.code?'me':''}" onclick="peek('${c}')">
           <div class="s">${t.glyph}</div><div class="n">${t.g}</div></div>`).join('')}</div>
      <div id="peekOut"></div>
    </div>

    <button class="btn" onclick="copyCard()">复制结果卡文案</button>
    <button class="btn ghost" onclick="show('s-intro')">再 起 一 卦</button>
    <p class="disc">娱乐向自我观察工具。变爻与归位会随你的状态漂移，建议隔一季度再起一次喵。<br>非命理预测，不构成任何决策建议。</p>
  `;
  buildPair(r);
}
function buildPair(r){
  const chips=document.getElementById('pairChips');
  chips.innerHTML = Object.entries(TYPES).map(([c,t])=>
    `<button class="chip" onclick="doPair('${c}','${r.code}',this)">${t.g} · ${t.wx}</button>`).join('');
}
function doPair(otherCode,myCode,btn){
  document.querySelectorAll('#pairChips .chip').forEach(c=>c.classList.remove('on'));
  btn.classList.add('on');
  const A=TYPES[myCode], B=TYPES[otherCode];
  const rel = (A.g===B.g) ? sameG() : REL_TEXT[relation(A.wx,B.wx)];
  document.getElementById('pairOut').innerHTML = `
    <div style="margin-top:14px;padding-top:14px;border-top:1px dashed rgba(232,165,181,.2)">
      <div style="font-size:15px;color:var(--brown)">${A.g} × ${B.g}
        <span class="badge rose" style="margin-left:6px">${rel.t}</span></div>
      <div class="meter"><i style="width:0"></i></div>
      <div class="small" style="color:var(--brown-light);font-size:13px;line-height:1.8">${rel.d}</div>
    </div>`;
  requestAnimationFrame(()=>{ document.querySelector('#pairOut .meter i').style.width=rel.s+'%'; });
}
function peek(c){
  const t=TYPES[c];
  document.getElementById('peekOut').innerHTML = `
    <div class="panel" style="margin-top:12px">
      <b>${t.label}</b> ${t.glyph} ｜ ${t.tri.join('·')} ｜ 本命${t.wx}<br>
      ${t.tagline}<br><span class="small" style="color:var(--brown-light)">${t.verdict}</span>
    </div>`;
}
function copyCard(){
  const r=compute(), T=r.type, W=WUXING[r.wx];
  const txt = [
    `【小猫起卦】我的本命格：${T.label} ${T.glyph}`,
    `${T.tagline}`,
    `${T.verdict}`,
    `当运 · ${r.wx}（${W.tone}）｜ ${COMBO[T.g][r.wx]}`,
    r.laos.length? `${T.g}之${r.flipType.g}：${ZHI[r.flipType.g]}` : '',
    `—— 起一卦：${location.href}`
  ].filter(Boolean).join('\n');
  navigator.clipboard.writeText(txt).then(()=>alert('已复制喵，可直接发朋友圈或发给别人配对。'))
   .catch(()=>{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
     ta.select(); document.execCommand('copy'); ta.remove(); alert('已复制喵。'); });
}

function openAtlas(){
  show('s-atlas');
  document.getElementById('s-atlas').innerHTML = `
    <div class="bt" style="font-size:15px;letter-spacing:5px">八 卦 谱 系 🐱</div>
    <div class="small" style="margin-bottom:14px">三爻 = 起手式（地）· 能量朝向（人）· 与世界（天）<br>
    取象直接沿用传统卦德：健顺动入陷丽止悦 —— 玄学在这里是坐标系，不是皮肤喵。</div>
    ${Object.entries(TYPES).map(([c,t])=>`
      <div class="panel" style="margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="font-size:30px;line-height:1">${t.glyph}</div>
          <div><b style="font-size:16px">${t.label}</b>
            <div class="small">${t.tri.join(' · ')} ｜ 本命${t.wx}</div></div>
        </div>
        <div style="margin-top:10px;font-size:13.5px;color:var(--brown)">${t.tagline}</div>
        <div class="small" style="margin-top:6px">${t.verdict}</div>
        <div class="small" style="color:var(--brown-light);margin-top:6px">阴影：${t.shade}</div>
      </div>`).join('')}
    <div class="bt" style="font-size:15px;letter-spacing:5px;margin-top:26px">五 运</div>
    ${WX_ORDER.map(w=>{const x=WUXING[w];return `
      <div class="panel" style="margin-bottom:10px;display:flex;gap:11px;align-items:flex-start">
        <span class="dot" style="background:${x.color};margin-top:7px"></span>
        <div><b>${w} · ${x.tone}</b><div class="small">${x.state}</div></div>
      </div>`}).join('')}
    <div class="bt" style="font-size:15px;letter-spacing:5px;margin-top:26px">生 克 关 系</div>
    <div class="panel small">
      比和（同气）· 生我（供给位）· 我生（输出位）· 我克（雕琢）· 克我（被校正）<br>
      另加一格：同卦（镜子）。共 6 类模板覆盖全部 36 组合喵。
    </div>
    <button class="btn" onclick="startQuiz()">起 卦 喵</button>
    <button class="btn ghost" onclick="show('s-intro')">返回</button>`;
}
</script>
</body>
